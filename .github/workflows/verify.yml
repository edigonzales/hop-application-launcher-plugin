name: Verify Application Launcher
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-verify.yml@main
    with:
      ci-ref: main
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-latest", "macos-15", "windows-latest"]'
      canonical-runner-os: ubuntu-latest
      canonical-java-version: '21'
      maven-goals: clean verify
      compatibility-goals: clean test
      pom-file: pom.xml
      zip-descriptors: >-
        [{"artifactId":"hop-application-launcher-plugin","zipGlob":"assemblies/target/hop-application-launcher-plugin-*.zip","pluginRoot":"plugins/misc/hop-application-launcher"}]
      validation-commands: '["python3 scripts/verify-package.py", "python3 scripts/check-docs.py", "python3 .ci/hop-plugin-ci/scripts/check-plugin-repository.py --profile desktop-plugin"]'
      artifact-name-prefix: hop-application-launcher-plugin
      group-id: ch.so.agi
      hop-version: 2.19.0
    secrets: inherit
